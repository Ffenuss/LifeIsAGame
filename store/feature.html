<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Fraunces';
        src: url('../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: 'Outfit';
        src: url('../node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
        font-style: normal;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: #071b1c;
        font-family: 'Outfit', sans-serif;
        color: #f4f7e9;
      }
      .frame {
        position: relative;
        width: 1024px;
        height: 500px;
        overflow: hidden;
      }
      .board {
        position: absolute;
        inset: 0;
        background: url('./source/board-wide.png') center right / cover no-repeat;
        transform: scale(1.03);
      }
      .wash {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(3, 16, 17, 0.97) 0%, rgba(3, 16, 17, 0.9) 32%, rgba(3, 16, 17, 0.45) 58%, rgba(3, 16, 17, 0.08) 82%),
          linear-gradient(180deg, rgba(3, 16, 17, 0.25), transparent 40%, rgba(3, 16, 17, 0.5));
      }
      .glow {
        position: absolute;
        width: 420px;
        height: 420px;
        left: 60px;
        top: 60px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(185, 242, 107, 0.16), transparent 68%);
        filter: blur(8px);
      }
      .copy {
        position: relative;
        z-index: 2;
        padding: 58px 0 0 68px;
        width: 560px;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #d7e6d2;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgba(185, 242, 107, 0.24);
        background: rgba(6, 29, 28, 0.55);
      }
      .eyebrow i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #b9f26b;
        box-shadow: 0 0 12px #b9f26b;
      }
      .logo {
        margin-top: 20px;
        font-family: 'Fraunces', Georgia, serif;
        font-style: italic;
        font-weight: 560;
        font-size: 118px;
        line-height: 0.76;
        letter-spacing: -0.05em;
        color: #f7f9ed;
        text-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
      }
      .sub {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
        font-size: 27px;
        font-weight: 600;
        letter-spacing: 0.38em;
        text-transform: uppercase;
        color: #b9f26b;
        white-space: nowrap;
      }
      .sub span {
        height: 1px;
        width: 46px;
        background: linear-gradient(90deg, transparent, rgba(185, 242, 107, 0.8));
      }
      .tag {
        margin: 18px 0 0;
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #c6d4c4;
      }
      .badges {
        display: flex;
        gap: 8px;
        margin-top: 28px;
      }
      .badge {
        padding: 9px 13px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(8, 34, 32, 0.66);
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #dce6d8;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="board"></div>
      <div class="wash"></div>
      <div class="glow"></div>
      <div class="copy">
        <div class="eyebrow"><i></i>A living board game</div>
        <div class="logo">Life</div>
        <div class="sub"><span></span>Estate</div>
        <p class="tag">Buy the land. Grow the life. Keep the fortune.</p>
        <div class="badges">
          <div class="badge">28 tiles</div>
          <div class="badge">16 colonies</div>
          <div class="badge">Offline</div>
        </div>
      </div>
    </div>
  </body>
</html>
